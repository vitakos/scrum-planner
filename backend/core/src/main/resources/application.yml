server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: scrum-planner-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scrum_planner}
    username: ${SPRING_DATASOURCE_USERNAME:scrum_planner}
    password: ${SPRING_DATASOURCE_PASSWORD:scrum_planner}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://scrum_planner:scrum_planner@localhost:27017/scrum_planner?authSource=admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  workspace:
    root: ${APP_WORKSPACE_ROOT:./workspaces}
  llm:
    # Minimal, single-provider LLM config for the Gap Analysis assistant (AISC-19).
    # Deliberately not the multi-provider "AI Gateway" module from the roadmap —
    # that's out of scope for this Epic; this is just enough to call one provider.
    provider: ${APP_LLM_PROVIDER:anthropic}
    api-key: ${APP_LLM_API_KEY:}
    model: ${APP_LLM_MODEL:claude-3-5-sonnet-20241022}
