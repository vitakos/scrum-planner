name: scrum-planner

# Local dev data storage: PostgreSQL (relational core) + MongoDB (flexible content).
# See ../database/README.md for how the schema/migrations are tracked and applied.
#
# Data is bind-mounted to a host folder (DB_DATA_DIR) so it survives
# `docker compose down` / container recreation.

services:
  postgres:
    image: postgres:16-alpine
    container_name: scrum-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrum_planner}
      POSTGRES_USER: ${POSTGRES_USER:-scrum_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrum_planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${DB_DATA_DIR:-C:/temp/scrum-planner-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrum_planner} -d ${POSTGRES_DB:-scrum_planner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: scrum-planner-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-scrum_planner}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-scrum_planner}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-scrum_planner}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${DB_DATA_DIR:-C:/temp/scrum-planner-data}/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
