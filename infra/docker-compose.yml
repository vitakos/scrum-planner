name: scrum-planner

# Local dev stack: PostgreSQL + MongoDB (data storage), backend/core (Spring
# Boot API) and frontend (React, served by nginx once built).
# See ../database/README.md for how the schema/migrations are tracked and
# applied — migrations must be applied (node ../database/migrate.js) *before*
# starting `backend`, since it validates its JPA mappings against the schema
# on startup and won't create tables itself.
#
# Mongo's data is bind-mounted to a host folder (DB_DATA_DIR) so it's easy to
# browse/back up and survives `docker compose down` / container recreation.
#
# Postgres's data lives in a named Docker volume (scrum-planner-postgres-data)
# instead of a DB_DATA_DIR bind mount: Postgres's initdb needs to chmod its
# data directory to 0700, which fails with "Operation not permitted" when
# that directory is a Windows path mounted into WSL2 (/mnt/c/... does not
# support Unix permission changes). A named volume avoids this entirely —
# Docker manages the storage, and it still persists across container
# recreation exactly like the Mongo bind mount does.

services:
  postgres:
    image: postgres:16-alpine
    container_name: scrum-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrum_planner}
      POSTGRES_USER: ${POSTGRES_USER:-scrum_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrum_planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - scrum-planner-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrum_planner} -d ${POSTGRES_DB:-scrum_planner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: scrum-planner-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-scrum_planner}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-scrum_planner}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-scrum_planner}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${DB_DATA_DIR:-C:/temp/scrum-planner-data}/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend/core
    container_name: scrum-planner-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scrum_planner}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-scrum_planner}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-scrum_planner}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        # Empty by default: nginx proxies same-origin /api calls to the backend
        # container (see frontend/nginx.conf). Only set this to make the built
        # assets call a backend at a different origin directly.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: scrum-planner-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  scrum-planner-postgres-data:
    name: scrum-planner-postgres-data
